feature: admin-zitadel
title: Admin app calls to the Zitadel management API with its service account
critical: true
code:
  - apps/admin/zitadel/**
  - prototype/k8s/apps/zitadel/values.yaml
  - tools/zitadelroles/**
c4: [adminPortal, authService]
links:
  issues: [HAMSP-23, HAMSP-36, HAMSP-91]
requirements: [C-03, C-04, QS-11]

acceptance:
  AC-1:
    text: >-
      The Zitadel client of the service account admin-app authenticates with an access token
      it gets from Zitadel by the JWT bearer grant (RFC 7523), signed with the account's JWT
      profile key. No request to Zitadel carries the private key or a personal access token.
    level: unit
    planned: apps/admin/zitadel/token_test.go:TestClientUsesJWTProfileToken
  AC-2:
    text: >-
      The client reuses its access token until shortly before it expires and gets a new one
      before that; a Zitadel call never fails because the access token expired.
    level: unit
    planned: apps/admin/zitadel/token_test.go:TestTokenRenewedBeforeExpiry
  AC-3:
    text: >-
      When Zitadel answers a call with unauthenticated (401), the client drops its access
      token, gets a new one and repeats the call once; a second 401 is returned to the caller.
    level: unit
    planned: apps/admin/zitadel/token_test.go:TestUnauthenticatedRetriesOnceWithNewToken
  AC-4:
    text: >-
      The admin app does not start when the key of its service account is missing or cannot be
      parsed, and its error names the setting; it never logs the key.
    level: unit
    planned: apps/admin/zitadel/key_test.go:TestLoadKeyRejectsMissingOrInvalid
  AC-5:
    text: >-
      After prototype/bootstrap-tenants.sh, admin-app has exactly one key, expiring at most
      30 days after the run, and no personal access tokens; the Secret admin/admin-zitadel
      holds that key and no tokens. A second run replaces the key and deletes the old one.
    level: integration
    planned: prototype/e2e/admin_credentials_test.go:TestAdminAppHasOnlyShortKey
  AC-6:
    text: >-
      On kind, the client with admin-app's key lists organizations and reads and changes the
      instance branding.
    level: integration
    planned: apps/admin/zitadel/branding_integration_test.go:TestBrandingIntegration
  AC-7:
    text: >-
      admin-app holds exactly the instance roles IAM_ORG_MANAGER and IAM_BRANDING_MANAGER. It
      can change the instance branding, and it is denied with permission_denied when it adds an
      instance member, changes an instance identity provider or adds an instance action.
    level: integration
    planned: prototype/e2e/admin_credentials_test.go:TestAdminAppRoleBoundary
  AC-8:
    text: >-
      At start and every 5 minutes, the admin app lists the credentials of admin-app. When it
      has a personal access token, a key other than the one the app uses, or a key valid for
      more than 30 days, the app logs one ERROR event service_account_credential_drift per
      finding, with the account and the credential's type and ID, never its secret.
    level: unit
    planned: apps/admin/zitadel/drift_test.go:TestCredentialDrift
  AC-9:
    text: >-
      On kind, adding a personal access token to admin-app makes the admin app log
      service_account_credential_drift for it within 5 minutes.
    level: integration
    planned: prototype/e2e/admin_credentials_test.go:TestCredentialDriftLogged
  AC-10:
    text: >-
      After Zitadel is installed on kind, the machine user iam-admin (IAM_OWNER, created by the
      Helm chart's setup job) has no personal access token, and the Secret zitadel/iam-admin-pat
      does not exist.
    level: integration
    planned: prototype/e2e/admin_credentials_test.go:TestIAMAdminHasNoPAT
  AC-11:
    text: >-
      prototype/bootstrap-tenants.sh calls Zitadel as iam-admin only with a short-lived access
      token it gets by the JWT bearer grant from iam-admin's key (Secret zitadel/iam-admin). It
      creates the tenant organizations, the test users and the admin app's service account and
      writes its output file as before.
    level: integration
    planned: prototype/e2e/admin_credentials_test.go:TestBootstrapOutputWithoutPAT
  AC-12:
    text: >-
      Each run of prototype/bootstrap-tenants.sh gives iam-admin a new key expiring at most
      30 days after the run, writes it to the Secret zitadel/iam-admin, and deletes iam-admin's
      other keys and any personal access token.
    level: integration
    planned: prototype/e2e/admin_credentials_test.go:TestBootstrapRerunRotatesKeys
  AC-13:
    text: >-
      The credential drift check of AC-8 also covers iam-admin: a personal access token, more
      than one key, or a key valid for more than 30 days logs service_account_credential_drift
      with the account and the credential's type and ID, never its secret.
    level: unit
    planned: apps/admin/zitadel/drift_test.go:TestCredentialDriftIAMAdmin
  AC-14:
    text: >-
      After prototype/bootstrap-tenants.sh, the machine user admin-app-instance does not exist,
      and the admin app has no instance token setting: the platform branding routes call
      Zitadel as admin-app.
    level: integration
    planned: prototype/e2e/admin_credentials_test.go:TestNoInstanceServiceAccount
  AC-15:
    text: >-
      The Zitadel role mappings in prototype/k8s/apps/zitadel/values.yaml equal Zitadel's
      defaults of the version the chart pins, plus the role IAM_BRANDING_MANAGER with
      instance policy permissions (iam.policy.*) only; any other difference fails CI.
    level: unit
    planned: tools/zitadelroles/roles_test.go:TestRoleMappingsMatchUpstream

checklist:
  T-01:
    planned: >-
      does not apply — the admin app is the platform admin and works across all tenants by
      design; no tenant data path changes
  T-02:
    planned: >-
      applies — the client decodes Zitadel v4.19.2's answers to the JWT bearer token request,
      user.v2 ListKeys and ListPersonalAccessTokens; a broken answer gives an error, not a
      panic; recorded answers, admin app → Zitadel
  T-04:
    planned: >-
      applies (critical) — on kind, admin-app does what the pages need (organizations, users,
      role assignments, organization and instance branding) and is denied outside its roles
      (instance members, IdPs, actions); the admin API's own 401/403 checks are unchanged;
      admin app → Zitadel
  T-08:
    planned: does not apply — no migration
  T-11:
    planned: >-
      does not apply — no new decoder of untrusted input; the key comes from our own Secret and
      Zitadel's answers are decoded with encoding/json as today
  T-12:
    planned: >-
      applies (critical) — three controls, each broken once by hand while its test must fail:
      admin-app given IAM_OWNER fails the AC-7 test; the drift check switched off fails AC-9;
      the chart's Pat block restored fails AC-10

quality_scenarios:
  touched: [QS-11]

gates:
  G-07: {status: pass, by: owner, date: 2026-11-09, note: plan for alpha approved in chat}
