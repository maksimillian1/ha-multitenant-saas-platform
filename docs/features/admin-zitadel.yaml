      - apps/admin/zitadel/token_test.go:TestBrokenTokenAnswerIsAnError
      - apps/admin/zitadel/drift_test.go:TestCredentialDrift
      - apps/admin/zitadel/drift_test.go:TestBrokenCredentialAnswer
  T-04:
    planned: >-
      applies (critical) — on kind, admin-app does what the pages need (organizations, users,
      role assignments, organization and instance branding) and is denied outside its roles
      (instance members, IdPs, actions); the admin API's own 401/403 checks are unchanged;
      admin app → Zitadel
    verified:
      - prototype/e2e/admin_credentials_test.go:TestAdminAppRoleBoundary
  T-08:
    planned: does not apply — no migration
    verified: n/a — no migration in the diff
  T-11:
    planned: >-
      does not apply — no new decoder of untrusted input; the key comes from our own Secret and
      Zitadel's answers are decoded with encoding/json as today
    verified: n/a — no new decoder of untrusted input; the key comes from our own Secret, Zitadel answers go through encoding/json
  T-12:
    planned: >-
      applies (critical) — three controls, each broken once by hand while its test must fail:
      admin-app given IAM_OWNER fails the AC-7 test; the drift check switched off fails AC-9;
      a personal access token given to iam-admin fails AC-10 (the chart's Pat block cannot be
      switched off, so it cannot be restored either; changed with AC-10 on 2026-11-09)
    verified:
      - prototype/e2e/admin_credentials_test.go:TestAdminAppRoleBoundary
      - prototype/e2e/admin_credentials_test.go:TestIAMAdminHasNoPAT
      - prototype/e2e/admin_credentials_test.go:TestCredentialDriftLogged

