feature: gateway-auth
title: JWT validation and tenant context in the API Gateway
critical: true
code:
  - apps/gateway/auth/**
  - prototype/bootstrap-tenants.sh
c4: [apiGateway, authService]
links:
  issues: [HAMSP-23, HAMSP-24]
requirements: [FR-03, QS-18]
acceptance:
  AC-1:
    text: A request with a valid platform-api token of a machine user whose organization is not in the API Gateway's tenant list gets 401 and never reaches the service behind the Gateway.
    level: e2e
    planned: prototype/e2e/gateway_test.go:TestNonTenantOrgGets401
  AC-2:
    text: A machine user of a tenant organization gets a token with the platform-api audience, and the API Gateway serves its request with x-tenant-id set to its organization ID.
    level: e2e
    planned: prototype/e2e/gateway_test.go:TestGrantedTenantGetsPlatformToken
  AC-3:
    text: prototype/bootstrap-tenants.sh writes the tenant organization IDs to the ConfigMap gateway/api-gateway-tenants and restarts the API Gateway only when the list changed; a rerun changes nothing.
    level: e2e
    planned: "manual: on a fresh kind cluster run prototype/bootstrap-tenants.sh twice; the second run leaves api-gateway-tenants unchanged and does not restart api-gateway; then go test -C prototype/e2e passes. Manual because rerunning the script inside the e2e suite would restart the gateway mid-run."
  AC-4:
    text: The API Gateway does not start when its tenant list is empty or unset.
    level: unit
    planned: apps/gateway/core/config_test.go:TestTenantsRequired
quality_scenarios:
  touched: [QS-18]
