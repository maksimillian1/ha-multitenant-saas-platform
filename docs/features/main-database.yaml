feature: main-database
title: The main PostgreSQL cluster, its pooler and the app roles' settings
critical: false
code:
  - prototype/k8s/apps/database/**
c4: [postgres]
links:
  issues: [HAMSP-59]
requirements: [QS-12, C-04]

acceptance:
  AC-1:
    text: A query that an app runs for tenant A through the pooler is cut by PgBouncer 30 s after it starts (FATAL query timeout), also when the app has set statement_timeout = 0.
    level: e2e
    planned: prototype/e2e/query_timeout_test.go:TestTenantQueryCutAfter30s
    verified: [prototype/e2e/query_timeout_test.go:TestTenantQueryCutAfter30s]
  AC-2:
    text: While tenant A's query runs, every GET /items of tenant B through the gateway succeeds, and their p95 is at most twice the p95 measured before plus 200 ms.
    level: e2e
    planned: prototype/e2e/query_timeout_test.go:TestTenantQueryCutAfter30s
    verified: [prototype/e2e/query_timeout_test.go:TestTenantQueryCutAfter30s]
  AC-3:
    text: Within 15 s after PgBouncer cuts the query, PostgreSQL no longer runs it.
    level: e2e
    planned: prototype/e2e/query_timeout_test.go:TestTenantQueryCutAfter30s
    verified: [prototype/e2e/query_timeout_test.go:TestTenantQueryCutAfter30s]
  AC-4:
    text: Connections to the primary that bypass the pooler (admins, platform services, migrations) have no query limit; migrations connect to the primary directly.
    level: e2e
    planned: prototype/e2e/query_timeout_test.go:TestDirectConnectionsHaveNoQueryLimit
    verified: [prototype/e2e/query_timeout_test.go:TestDirectConnectionsHaveNoQueryLimit]

checklist:
  T-01:
    planned: applies — tenant A's long query and tenant B's requests at the same time; e2e through the gateway, ExampleApp, PgBouncer and PostgreSQL (AC-1, AC-2)
    verified: [prototype/e2e/query_timeout_test.go:TestTenantQueryCutAfter30s]
  T-02:
    planned: does not apply — no API contract; the rule for apps (30 s, 504) is in docs/INTEGRATION.md
    verified: n/a — the diff adds or changes no contract in docs/contracts
  T-04:
    planned: does not apply — no endpoint and no role changes who may call what
    verified: n/a — no endpoint or role in the diff
  T-08:
    planned: does not apply — no schema migration
    verified: n/a — no migration in the diff
  T-11:
    planned: does not apply — no new input parser
    verified: n/a — no new input parser in the diff
  T-12:
    planned: applies — the cut query sets statement_timeout = 0, so a limit an app can lift would not pass (AC-1); the server side is checked in pg_stat_activity, not only the client's error (AC-3)
    verified: [prototype/e2e/query_timeout_test.go:TestTenantQueryCutAfter30s]

comments:
  - at: prototype/k8s/apps/database/cluster.yaml:Pooler.parameters.query_timeout
    text: "# The tenant query limit (QS-12): only pooled connections get it, so admins and platform services on -rw do not."
    why: hidden invariant, the limit is deliberately not in PostgreSQL
  - at: prototype/k8s/apps/database/cluster.yaml:postgresql.parameters.client_connection_check_interval
    text: "# PgBouncer's query_timeout only closes the connection; this makes the backend stop the query too."
    why: external behaviour of PgBouncer

quality_scenarios:
  touched: [QS-12]
  recommended_runs:
    - "QS-12: k6 load of tenant B while tenant A runs a long query through the pooler; not run"
  tests:
    QS-12:
      planned: prototype/e2e/query_timeout_test.go:TestTenantQueryCutAfter30s
      verified: [prototype/e2e/query_timeout_test.go:TestTenantQueryCutAfter30s]

