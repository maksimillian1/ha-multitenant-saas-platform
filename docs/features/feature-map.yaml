feature: feature-map
title: One file per feature, a generated map of all features and a pull request report
critical: false
code:
  - tools/featuremap/**
  - .github/workflows/features.yml
links:
  issues: [HAMSP-45]

acceptance:
  AC-1:
    text: A change to a feature file without regenerating the map fails CI.
    level: integration
    planned: tools/featuremap/featuremap_test.go:TestRun
  AC-2:
    text: A feature file fails CI when it has an unknown field, a bad stage, a name that differs from its file name, a stage not backed by a ready verify run, or a stable stage without a review.
    level: unit
    planned: tools/featuremap/featuremap_test.go:TestValidate
  AC-3:
    text: A verified test that does not exist, or has no Verifies comment naming the feature and the ID, fails CI.
    level: unit
    planned: tools/featuremap/featuremap_test.go:TestCheckTest
  AC-4:
    text: A pull request that changes the code of a feature gets one comment listing each touched feature with its stage, critical mark, files changed and files changed since its last review. No stage changes automatically.
    level: integration
    planned: tools/featuremap/featuremap_test.go:TestPRReport
  AC-5:
    text: The skills feature-clarify, feature-plan and feature-verify read and write the feature file and need nothing from Linear to decide a verdict.
    level: manual
    planned: "manual: run feature-clarify, feature-plan and feature-verify on one new feature without opening Linear"

checklist:
  T-01:
    verified: n/a — repository tooling; it reads no tenant data
  T-02:
    verified: n/a — no input crosses a service boundary; feature files are read by one tool in the repo
  T-08:
    verified: n/a — no migration in the diff

