name: features

# Feature files in docs/features and the map generated from them
# (docs/features/README.md). See docs/features/README.md, "CI".
on:
  pull_request:
  push:
    branches: [master]

jobs:
  map:
    # tools/featuremap is its own Go module; no other workflow tests it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/featuremap/go.mod
          cache-dependency-path: tools/featuremap/go.sum
      - name: Test the generator
        run: go -C tools/featuremap test -count=1 ./...
      - name: Feature files are valid and the map is up to date
        run: go -C tools/featuremap run . -check

  touched:
    # A comment on the pull request: the features whose code it changes,
    # with their stage. It changes no stage; the owner decides.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base branch and the review commits
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/featuremap/go.mod
          cache-dependency-path: tools/featuremap/go.sum
      - name: Report
        run: go -C tools/featuremap run . -pr "origin/${{ github.base_ref }}" > "$RUNNER_TEMP/features.md"
      - name: Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/features.md`, 'utf8');
            const marker = '<!-- featuremap-pr -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
