name: security

on:
  pull_request:
  push:
    branches: [master]

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: The check fails on a reachable vulnerability (negative fixture)
        run: .github/security-scan/test.sh case_govulncheck
      - name: Every Go module under apps and tools
        run: |
          status=0
          for m in $(find apps tools -name go.mod -not -path '*/testdata/*' -exec dirname {} \; | sort); do
            echo "== $m"
            (cd "$m" && govulncheck ./...) || status=1
          done
          exit $status

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/admin/ui/app/.nvmrc
      - name: The check fails on a production advisory, not on a dev one (fixtures)
        run: .github/security-scan/test.sh case_npm_audit
      - name: Admin SPA
        working-directory: apps/admin/ui/app
        run: npm audit --omit=dev --audit-level=high

  trivy-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aquasecurity/setup-trivy@v0.2.3
        with:
          version: v0.76.2
      - name: The check fails on a fixable vulnerability (negative fixture)
        if: matrix.platform == 'linux/amd64'
        run: .github/security-scan/test.sh case_trivy_image
      - name: Build every image we ship
        run: |
          for a in gateway admin exampleapp exampleweb tenants; do
            docker buildx build --platform ${{ matrix.platform }} --load -t scan/$a apps/$a
          done
          for t in writeapi writer migrate; do
            (cd apps/usage && docker buildx bake --set "$t.platform=${{ matrix.platform }}" \
              --set "$t.tags=scan/usage-$t" --load $t)
          done
          docker buildx build --platform ${{ matrix.platform }} --load -t scan/timescaledb images/timescaledb
      # --ignore-unfixed: fail only when a fixed version exists, so every red build has an update to apply.
      - name: Scan the images
        run: |
          status=0
          for img in $(docker images 'scan/*' --format '{{.Repository}}'); do
            echo "== $img"
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --ignorefile .trivyignore.yaml --platform ${{ matrix.platform }} "$img" || status=1
          done
          exit $status

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/setup-trivy@v0.2.3
        with:
          version: v0.76.2
      - name: The check fails on HIGH, and the ignore file expires (fixtures)
        run: .github/security-scan/test.sh case_trivy_config case_trivy_ignore_expiry
      - name: Kind manifests
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore.yaml prototype/k8s

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.144.0
    steps:
      - uses: actions/checkout@v4
      - name: The rule's test cases
        run: semgrep --test --metrics=off --config .semgrep/log-secrets.yaml .semgrep/log-secrets.go
      - name: Go code
        run: semgrep scan --config .semgrep/log-secrets.yaml --error --metrics=off apps tools prototype
