name: zitadel

# Zitadel's role mappings in the prototype's values are its defaults plus our
# own roles, nothing else (tools/zitadelroles; admin-zitadel AC-15).
on:
  pull_request:
    paths:
      - "prototype/k8s/apps/zitadel/**"
      - "tools/zitadelroles/**"
      - ".github/workflows/zitadel.yml"
  push:
    branches: [master]
    paths:
      - "prototype/k8s/apps/zitadel/**"
      - "tools/zitadelroles/**"
      - ".github/workflows/zitadel.yml"

jobs:
  roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/zitadelroles/go.mod
          cache-dependency-path: tools/zitadelroles/go.sum
      - name: Role mappings match Zitadel's defaults plus our roles
        run: go -C tools/zitadelroles test -count=1 ./...
