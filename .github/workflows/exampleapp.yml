name: exampleapp

on:
  pull_request:
    paths:
      - "apps/exampleapp/**"
      - ".github/workflows/exampleapp.yml"
  push:
    branches: [master]
    paths:
      - "apps/exampleapp/**"
      - ".github/workflows/exampleapp.yml"

jobs:
  test:
    # Applies all migrations to a clean PostgreSQL and fails if any table with a
    # tenant_id column lacks enabled and forced RLS (QS-01, HAMSP-5 AC-10).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        # An explicit bash shell adds -o pipefail, so `go test | tee` fails on test failures.
        shell: bash
        working-directory: apps/exampleapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/exampleapp/go.mod
          cache-dependency-path: apps/exampleapp/go.sum
      - run: go vet ./...
      - name: Build for arm64 (C-06)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null .
      # -count=1 disables the test cache; a skipped DB test must not pass silently.
      - run: go test -count=1 -v ./... 2>&1 | tee test.log
      - name: Fail if database tests were skipped
        run: "! grep -q -- '--- SKIP' test.log"
