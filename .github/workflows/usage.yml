name: usage

on:
  pull_request:
    paths:
      - "apps/usage/**"
      - ".github/workflows/usage.yml"
  push:
    branches: [master]
    paths:
      - "apps/usage/**"
      - ".github/workflows/usage.yml"

jobs:
  test:
    # Applies all migrations to a clean TimescaleDB (TSL edition, the version of
    # images/timescaledb) and fails if any relation with a tenant_id column is
    # open to an application role without tenant isolation (QS-01, ADR-0008).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.27.2-pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        # An explicit bash shell adds -o pipefail, so `go test | tee` fails on test failures.
        shell: bash
        working-directory: apps/usage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/usage/go.mod
          cache-dependency-path: apps/usage/go.sum
      - run: go vet ./...
      - name: Build for arm64 (C-06)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null .
      # -count=1 disables the test cache; a skipped DB test must not pass silently.
      - run: go test -count=1 -v ./... 2>&1 | tee test.log
      - name: Fail if database tests were skipped
        run: "! grep -q -- '--- SKIP' test.log"
