name: lint

# The pre-commit checks of lefthook.yml, run again in CI (HAMSP-40).
# The SPA's oxlint and tsc run in admin.yml.

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "apps/**"
      - ".golangci.yml"
      - ".github/workflows/lint.yml"

jobs:
  go:
    # The shared .golangci.yml on every Go module. Every app is at zero
    # findings, so any finding fails the build.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, admin, exampleapp, usage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/${{ matrix.app }}/go.mod
          cache-dependency-path: apps/${{ matrix.app }}/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: apps/${{ matrix.app }}
          args: --config=${{ github.workspace }}/.golangci.yml

  gitleaks:
    # Secrets in the commits of the pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan the pull request's commits
        run: >-
          ./gitleaks git --redact --no-banner --verbose
          --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          .
