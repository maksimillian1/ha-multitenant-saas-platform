rules:
  - id: log-secrets
    languages: [go]
    severity: ERROR
    message: A token, secret, password or Authorization header is written to a log.
    patterns:
      - pattern-either:
          - pattern: slog.$F(...)
          - pattern: log.$F(...)
          - pattern: $L.$F(...)
      - metavariable-regex:
          metavariable: $F
          regex: ^((Debug|Info|Warn|Error|Log|LogAttrs)(Context)?|(Print|Fatal|Panic)(f|ln)?)$
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $C(..., "$KEY", ...)
                  - pattern: $C(..., slog.$A("$KEY", ...), ...)
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^\S*(token|secret|password|authorization)\S*$
          - patterns:
              - pattern-either:
                  - pattern: $C(..., $X, ...)
                  - pattern: $C(..., $S.$X, ...)
              - metavariable-regex:
                  metavariable: $X
                  regex: (?i)^\w*(token|secret|password|authorization)\w*$
          - pattern: $C(..., $R.Header.Get("Authorization"), ...)
