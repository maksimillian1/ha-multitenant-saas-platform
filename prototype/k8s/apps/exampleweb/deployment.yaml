# Tenant web page of ExampleApp (apps/exampleweb): signs tenant users in with
# Zitadel, lists their items through the API Gateway with their own token, and
# links tenant admins to the Zitadel Console. prototype/bootstrap-tenants.sh
# creates the OIDC app and the Secret exampleweb-oidc; until then the pod waits
# in CreateContainerConfigError.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exampleweb
  namespace: exampleweb
spec:
  # One replica: sessions live in the pod's memory.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: exampleweb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exampleweb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: exampleweb
          # Built and loaded into kind by prototype/create-cluster.sh.
          image: hamsp/exampleweb:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ISSUER
              value: http://zitadel.localtest.me:30080
            # The issuer's name does not resolve inside the cluster; talk to the
            # Zitadel Service with the issuer as Host header.
            - name: ISSUER_DIAL_ADDR
              value: zitadel.zitadel.svc:8080
            - name: PUBLIC_URL
              value: http://exampleweb.localtest.me:30080
            - name: GATEWAY_URL
              value: http://api-gateway.gateway.svc:8080
            - name: CONSOLE_URL
              value: http://zitadel.localtest.me:30080/ui/console
          # CLIENT_ID, CLIENT_SECRET, AUDIENCE (bootstrap-tenants.sh).
          envFrom:
            - secretRef:
                name: exampleweb-oidc
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: exampleweb
  namespace: exampleweb
spec:
  selector:
    app.kubernetes.io/name: exampleweb
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# exampleweb.localtest.me on the public Gateway. The app signs users in itself
# (OIDC), so like the admin app's route this one skips the API Gateway, which
# only accepts bearer tokens.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exampleweb
  namespace: exampleweb
spec:
  parentRefs:
    - name: public
      namespace: gateway
  hostnames:
    - exampleweb.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: exampleweb
          port: 8080
