apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-jwks
  namespace: gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jwks-sync
  namespace: gateway
---
# Only this job may write zitadel-jwks; the gateway only reads it, so a compromised gateway cannot plant keys.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jwks-sync
  namespace: gateway
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [zitadel-jwks]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jwks-sync
  namespace: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jwks-sync
subjects:
  - kind: ServiceAccount
    name: jwks-sync
    namespace: gateway
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jwks-sync
  namespace: gateway
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 50
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jwks-sync
        spec:
          serviceAccountName: jwks-sync
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
          containers:
            - name: jwks-sync
              image: hamsp/gateway:dev
              imagePullPolicy: IfNotPresent
              args: [jwks-sync]
              env:
                - name: ISSUER
                  value: http://zitadel.localtest.me:30080
                - name: ISSUER_DIAL_ADDR
                  value: zitadel.zitadel.svc:8080
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 32Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
