# Kafka SCRAM login of the API Gateway (HAMSP-31). Local kind prototype only;
# matches prototype/k8s/apps/kafka/templates/users.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-kafka
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  KAFKA_USERNAME: api-gateway
  KAFKA_PASSWORD: dev-api-gateway-kafka # gitleaks:allow
