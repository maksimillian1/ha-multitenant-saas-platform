# Super admin app (apps/admin): one page, shown only after a Zitadel sign-in
# by a user with the super-admin role of the platform-admin project.
# prototype/bootstrap-tenants.sh creates the OIDC app and the Secret
# admin-oidc; until then the pods wait in CreateContainerConfigError.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
    spec:
      containers:
        - name: admin
          # Built and loaded into kind by prototype/create-cluster.sh.
          image: hamsp/admin:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ISSUER
              value: http://zitadel.localtest.me:30080
            # The issuer's name does not resolve inside the cluster; talk to the
            # Zitadel Service with the issuer as Host header.
            - name: ISSUER_DIAL_ADDR
              value: zitadel.zitadel.svc:8080
            - name: PUBLIC_URL
              value: http://admin.localtest.me:30080
          envFrom:
            - secretRef:
                name: admin-oidc
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: admin
spec:
  selector:
    app.kubernetes.io/name: admin
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# admin.localtest.me on the public Gateway. The app signs users in itself
# (OIDC), so like Zitadel's route this one skips the API Gateway, which only
# accepts bearer tokens.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin
  namespace: admin
spec:
  parentRefs:
    - name: public
      namespace: gateway
  hostnames:
    - admin.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: admin
          port: 8080
