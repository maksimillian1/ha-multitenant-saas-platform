# Super admin app (apps/admin): pages for Zitadel's organizations, users,
# role assignments and projects, shown only after a Zitadel sign-in by a user
# with the super-admin role of the platform-admin project (HAMSP-34).
# prototype/bootstrap-tenants.sh creates the OIDC app and the Secret
# admin-oidc, and the service account admin-app with its JWT profile key in
# the Secret admin-zitadel (key.json, valid 30 days, HAMSP-36); until then the
# pods wait in CreateContainerConfigError.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
    spec:
      # The image runs as distroless nonroot (65532); fsGroup lets it read the
      # key file, which is not readable by others.
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
      containers:
        - name: admin
          # Built and loaded into kind by prototype/create-cluster.sh.
          image: hamsp/admin:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ISSUER
              value: http://zitadel.localtest.me:30080
            # The issuer's name does not resolve inside the cluster; talk to the
            # Zitadel Service with the issuer as Host header.
            - name: ISSUER_DIAL_ADDR
              value: zitadel.zitadel.svc:8080
            - name: PUBLIC_URL
              value: http://admin.localtest.me:30080
            # The admin app calls the Zitadel APIs at ISSUER (through
            # ISSUER_DIAL_ADDR) as the service account admin-app, with
            # short-lived tokens it gets with this key.
            - name: ZITADEL_KEY_FILE
              value: /var/run/secrets/zitadel/key.json
          envFrom:
            - secretRef:
                name: admin-oidc
          volumeMounts:
            - name: zitadel-key
              mountPath: /var/run/secrets/zitadel
              readOnly: true
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: zitadel-key
          secret:
            secretName: admin-zitadel
            items:
              - key: key.json
                path: key.json
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: admin
spec:
  selector:
    app.kubernetes.io/name: admin
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# admin.localtest.me on the public Gateway. The app signs users in itself
# (OIDC), so like Zitadel's route this one skips the API Gateway, which only
# accepts bearer tokens.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin
  namespace: admin
spec:
  parentRefs:
    - name: public
      namespace: gateway
  hostnames:
    - admin.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: admin
          port: 8080
