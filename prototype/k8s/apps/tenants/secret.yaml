# Local kind prototype credentials only. They match prototype/k8s/apps/database/cluster.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: tenants-db
  namespace: tenants
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  # Runtime role, straight to the primary, not through PgBouncer: each
  # request holds a session advisory lock on its tenant (ADR-0012), which a
  # transaction-mode pooler would hand to other clients.
  DATABASE_URL: postgres://tenants:dev-tenants@main-pg-cluster-rw.database.svc:5432/tenants?sslmode=require
  # Owner role. Used only by the migration job.
  MIGRATE_DATABASE_URL: postgres://tenants_owner:dev-tenants-owner@main-pg-cluster-rw.database.svc:5432/tenants?sslmode=require
