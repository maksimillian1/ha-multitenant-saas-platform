# Runs on every sync before the Deployment rolls out (sync wave 0 < 1).
apiVersion: batch/v1
kind: Job
metadata:
  name: tenants-migrate
  namespace: tenants
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenants-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: hamsp/tenants:dev
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tenants-db
                  key: MIGRATE_DATABASE_URL
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
