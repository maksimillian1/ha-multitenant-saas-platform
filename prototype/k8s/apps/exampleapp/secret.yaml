# Local kind prototype credentials only. They match prototype/k8s/apps/database/cluster.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: exampleapp-db
  namespace: exampleapp
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  # Runtime role through PgBouncer (transaction mode).
  DATABASE_URL: postgres://exampleapp:dev-exampleapp@main-pg-cluster-pooler-rw.database.svc:5432/exampleapp?sslmode=require
  # Owner role, straight to the primary. Used only by the migration job.
  MIGRATE_DATABASE_URL: postgres://exampleapp_owner:dev-exampleapp-owner@main-pg-cluster-rw.database.svc:5432/exampleapp?sslmode=require
