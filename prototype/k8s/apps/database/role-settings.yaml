# CNPG managed roles cannot carry parameters, so the platform sets them with SQL after every sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: role-settings
  namespace: database
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: role-settings
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:16.3
          imagePullPolicy: IfNotPresent
          env:
            - {name: PGHOST, value: main-pg-cluster-rw}
            - {name: PGDATABASE, value: postgres}
            - {name: PGSSLMODE, value: require}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: postgres-superuser, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: postgres-superuser, key: password}}
          command: [psql, -v, ON_ERROR_STOP=1, -c]
          args:
            - |
              ALTER ROLE exampleapp SET statement_timeout = '30s';
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
