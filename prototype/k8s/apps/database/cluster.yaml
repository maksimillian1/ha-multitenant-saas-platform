apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: database
type: Opaque
stringData:
  accessKeyId: "minioadmin"
  secretAccessKey: "minioadmin"
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main-pg-cluster
  namespace: database
spec:
  instances: 3
  storage:
    size: 5Gi
  enableSuperuserAccess: true
  postgresql:
    parameters:
      shared_buffers: "256MB"
      track_io_timing: "on"
      log_autovacuum_min_duration: "0"
      log_lock_waits: "on"
      log_checkpoints: "on"
    synchronous:
      method: any
      number: 1
  backup:
    barmanObjectStore:
      destinationPath: s3://postgres-backups/
      endpointURL: http://minio.minio.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: minio-creds
          key: accessKeyId
        secretAccessKey:
          name: minio-creds
          key: secretAccessKey
      wal:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: lab-pooler-rw
spec:
  cluster: { name: lab }
  instances: 1
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      default_pool_size: "1"
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: main-pg-cluster-manual-backup
  namespace: database
spec:
  cluster:
    name: main-pg-cluster
