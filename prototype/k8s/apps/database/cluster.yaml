# Credentials in this directory are for the local kind prototype only.
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: database
type: Opaque
stringData:
  accessKeyId: "minioadmin"
  secretAccessKey: "minioadmin"
---
# Superuser. Zitadel's init job uses it to create its own database and user (ADR-0003).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: dev-postgres-superuser
---
# Owner of the exampleapp database. Only the migration job uses it.
apiVersion: v1
kind: Secret
metadata:
  name: exampleapp-owner
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: exampleapp_owner
  password: dev-exampleapp-owner
---
# Runtime role of ExampleApp: not the owner, NOSUPERUSER, NOBYPASSRLS (HAMSP-5 AC-7).
apiVersion: v1
kind: Secret
metadata:
  name: exampleapp-db
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: exampleapp
  password: dev-exampleapp
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main-pg-cluster
  namespace: database
spec:
  instances: 3
  storage:
    size: 5Gi
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-superuser
  bootstrap:
    initdb:
      database: exampleapp
      owner: exampleapp_owner
      secret:
        name: exampleapp-owner
  managed:
    roles:
      - name: exampleapp
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        inherit: false
        passwordSecret:
          name: exampleapp-db
  postgresql:
    parameters:
      shared_buffers: "256MB"
      track_io_timing: "on"
      log_autovacuum_min_duration: "0"
      log_lock_waits: "on"
      log_checkpoints: "on"
    synchronous:
      method: any
      number: 1
  backup:
    barmanObjectStore:
      destinationPath: s3://postgres-backups/
      endpointURL: http://minio.minio.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: minio-creds
          key: accessKeyId
        secretAccessKey:
          name: minio-creds
          key: secretAccessKey
      wal:
        compression: gzip
---
# PgBouncer in front of the primary. ExampleApp connects here.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: main-pg-cluster-pooler-rw
  namespace: database
spec:
  cluster:
    name: main-pg-cluster
  instances: 1
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      # Smaller than ExampleApp's own pool, so server connections are reused
      # across tenants and requests (HAMSP-5 AC-9).
      default_pool_size: "2"
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: main-pg-cluster-manual-backup
  namespace: database
spec:
  cluster:
    name: main-pg-cluster
