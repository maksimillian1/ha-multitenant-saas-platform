# Credentials in this directory are for the local kind prototype only.
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: database
type: Opaque
stringData:
  accessKeyId: "minioadmin"
  secretAccessKey: "minioadmin"
---
# Superuser. Zitadel's init job uses it to create its own database and user (ADR-0003).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: dev-postgres-superuser
---
# Owner of the exampleapp database. Only the migration job uses it.
apiVersion: v1
kind: Secret
metadata:
  name: exampleapp-owner
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: exampleapp_owner
  password: dev-exampleapp-owner
---
# Runtime role of ExampleApp: not the owner, NOSUPERUSER, NOBYPASSRLS.
apiVersion: v1
kind: Secret
metadata:
  name: exampleapp-db
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: exampleapp
  password: dev-exampleapp
---
# Owner of the tenants database of Tenant Management. Only its
# migration job uses it.
apiVersion: v1
kind: Secret
metadata:
  name: tenants-owner
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: tenants_owner
  password: dev-tenants-owner
---
# Runtime role of Tenant Management: not the owner, NOSUPERUSER, NOBYPASSRLS.
apiVersion: v1
kind: Secret
metadata:
  name: tenants-db
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: tenants
  password: dev-tenants
---
# Owner of the kantor database (ADR-0013). Only KANTOR's migration job uses it.
apiVersion: v1
kind: Secret
metadata:
  name: kantor-owner
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: kantor_owner
  password: dev-kantor-owner
---
# Runtime role of KANTOR: not the owner, NOSUPERUSER, NOBYPASSRLS.
apiVersion: v1
kind: Secret
metadata:
  name: kantor-db
  namespace: database
type: kubernetes.io/basic-auth
stringData:
  username: kantor_app
  password: dev-kantor-app
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main-pg-cluster
  namespace: database
spec:
  instances: 3
  # Pinned: without imageName every operator upgrade moves the cluster to the
  # operator's default image, which for CNPG 1.30 is PostgreSQL 18.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.3
  storage:
    size: 5Gi
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-superuser
  bootstrap:
    initdb:
      database: exampleapp
      owner: exampleapp_owner
      secret:
        name: exampleapp-owner
  managed:
    roles:
      - name: exampleapp
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        inherit: false
        passwordSecret:
          name: exampleapp-db
      - name: tenants_owner
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: tenants-owner
      - name: tenants
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        inherit: false
        passwordSecret:
          name: tenants-db
      - name: kantor_owner
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        passwordSecret:
          name: kantor-owner
      # KANTOR's migrations grant table rights to kantor_app only if it exists, so it must exist before they run.
      - name: kantor_app
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        createdb: false
        createrole: false
        inherit: false
        passwordSecret:
          name: kantor-db
      # The usage database moved to its own cluster (ADR-0008, usage-db). These
      # drop what the usage pipeline left here on clusters created before the move.
      - name: usage_writer
        ensure: absent
      - name: usage_owner
        ensure: absent
  postgresql:
    parameters:
      shared_buffers: "256MB"
      track_io_timing: "on"
      log_autovacuum_min_duration: "0"
      log_lock_waits: "on"
      log_checkpoints: "on"
      # PgBouncer's query_timeout only closes the connection; this makes the backend stop the query too.
      client_connection_check_interval: "10s"
    # Quorum synchronous replication: a commit waits for ANY 1 standby.
    synchronous:
      method: any
      number: 1
  # A rolling update (new image, new operator) moves the primary to an updated
  # standby first instead of restarting it in place, so writes stop only for
  # the switchover.
  primaryUpdateMethod: switchover
  backup:
    barmanObjectStore:
      destinationPath: s3://postgres-backups/
      endpointURL: http://minio.minio.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: minio-creds
          key: accessKeyId
        secretAccessKey:
          name: minio-creds
          key: secretAccessKey
      wal:
        compression: gzip
---
# PgBouncer in front of the primary. ExampleApp connects here.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: main-pg-cluster-pooler-rw
  namespace: database
spec:
  cluster:
    name: main-pg-cluster
  instances: 1
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      # Smaller than ExampleApp's own pool, so server connections are reused
      # across tenants and requests.
      default_pool_size: "2"
      # The tenant query limit (QS-12): only pooled connections get it, so admins and platform services on -rw do not.
      query_timeout: "30"
      # pgx caches prepared statements per connection; PgBouncer re-prepares them on whichever server connection it picks.
      max_prepared_statements: "200"
      # Closes a client that holds a transaction open without a query, so it cannot pin a server connection.
      idle_transaction_timeout: "60"
---
# The usage database lived here until it moved to its own cluster
# (ADR-0008). This drops it on clusters created before the move; on new ones
# it does nothing.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: legacy-usage
  namespace: database
spec:
  name: usage
  owner: usage_owner
  cluster:
    name: main-pg-cluster
  ensure: absent
  databaseReclaimPolicy: delete
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: main-pg-cluster-manual-backup
  namespace: database
spec:
  cluster:
    name: main-pg-cluster
---
# The tenant registry of Tenant Management (ADR-0012), its own database in the
# main cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: tenants
  namespace: database
spec:
  name: tenants
  owner: tenants_owner
  cluster:
    name: main-pg-cluster
---
# KANTOR, the first business app (ADR-0013), in its own database.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kantor
  namespace: database
spec:
  name: kantor
  owner: kantor_owner
  cluster:
    name: main-pg-cluster
