# Zitadel for the local kind prototype (ADR-0003): own namespace, own database
# in the CNPG cluster, no code changes. Not a production config (HAMSP-5 out of scope).
zitadel:
  replicaCount: 1
  zitadel:
    # Local prototype only. Exactly 32 bytes.
    masterkey: devOnlyMasterkeyForKindPrototype
    configmapConfig:
      # The setup job creates the machine user iam-admin (IAM_OWNER) with a JWT
      # profile key (Secret zitadel/iam-admin) and a personal access token
      # valid until 2029 (Secret zitadel/iam-admin-pat). The token cannot be
      # switched off here: Helm does not apply a null from this umbrella chart
      # to the subchart's default, and the chart's schema rejects anything but
      # an object. bootstrap-tenants.sh deletes the token and its Secret and
      # replaces the key with a 30-day key on every run (HAMSP-36).
      #
      # Zitadel's own role mappings, copied from its defaults because a list in
      # the config replaces the default list as a whole, plus our role
      # IAM_BRANDING_MANAGER at the end. tools/zitadelroles checks in CI that
      # the copy equals the defaults of the chart's Zitadel version (AC-15 of
      # docs/features/admin-zitadel.yaml); refresh it when the chart changes.
      InternalAuthZ:
        RolePermissionMappings:
          - Role: "SYSTEM_OWNER"
            Permissions:
              - "system.instance.read"
              - "system.instance.write"
              - "system.instance.delete"
              - "system.domain.read"
              - "system.domain.write"
              - "system.domain.delete"
              - "system.debug.read"
              - "system.debug.write"
              - "system.debug.delete"
              - "system.feature.read"
              - "system.feature.write"
              - "system.feature.delete"
              - "system.limits.write"
              - "system.limits.delete"
              - "system.quota.write"
              - "system.quota.delete"
              - "system.iam.member.read"
          - Role: "SYSTEM_OWNER_VIEWER"
            Permissions:
              - "system.instance.read"
              - "system.domain.read"
              - "system.debug.read"
              - "system.feature.read"
              - "system.iam.member.read"
          - Role: "IAM_OWNER"
            Permissions:
              - "iam.read"
              - "iam.write"
              - "iam.policy.read"
              - "iam.policy.write"
              - "iam.policy.delete"
