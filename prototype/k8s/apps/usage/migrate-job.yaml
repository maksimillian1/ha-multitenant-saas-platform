# Creates the usage database and applies its migrations on every sync, before
# the deployments roll out (sync wave 0 < 1).
apiVersion: batch/v1
kind: Job
metadata:
  name: usage-migrate
  namespace: usage
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: usage-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # Built and loaded into kind by prototype/create-cluster.sh.
          image: hamsp/usage:dev
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: ADMIN_DATABASE_URL
              valueFrom: {secretKeyRef: {name: usage-db, key: ADMIN_DATABASE_URL}}
            - name: MIGRATE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: usage-db, key: MIGRATE_DATABASE_URL}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
