# Applies the usage migrations on every sync, before the deployments roll out
# (sync wave 0, then writer in 1 and writeapi in 2). A Sync hook, not PreSync:
# its Secret is created in wave -1 of the same sync. It fails until the usage
# cluster's Database resource has created the timescaledb extension; the Job
# retries.
apiVersion: batch/v1
kind: Job
metadata:
  name: usage-migrate
  namespace: usage
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: usage-migrate
    spec:
      serviceAccountName: usage-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: migrate
          # Built and loaded into kind by prototype/create-cluster.sh.
          image: hamsp/usage-migrate:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: MIGRATE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: usage-migrate-db, key: MIGRATE_DATABASE_URL}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
