# Local kind prototype credentials only. They match prototype/k8s/apps/usage-db/cluster.yaml.
# One Secret per binary, so each pod gets only its own role; writeapi has none.
apiVersion: v1
kind: Secret
metadata:
  name: usage-writer-db
  namespace: usage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  # Usage Writer's role through PgBouncer (transaction mode) on the usage cluster (ADR-0008).
  DATABASE_URL: postgres://usage_writer:dev-usage-writer@usage-pg-cluster-pooler-rw.usage-db.svc:5432/usage?sslmode=require
---
apiVersion: v1
kind: Secret
metadata:
  name: usage-migrate-db
  namespace: usage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  # Owner role, straight to the primary. Used only by the migrate job; CNPG's
  # Database resource creates the database and the timescaledb extension.
  MIGRATE_DATABASE_URL: postgres://usage_owner:dev-usage-owner@usage-pg-cluster-rw.usage-db.svc:5432/usage?sslmode=require
---
# Kafka SCRAM credentials (HAMSP-31). They match the KafkaUser passwords in
# prototype/k8s/apps/kafka/templates/users.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: usage-writeapi-kafka
  namespace: usage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  KAFKA_USERNAME: usage-writeapi
  KAFKA_PASSWORD: dev-usage-writeapi-kafka # gitleaks:allow
---
apiVersion: v1
kind: Secret
metadata:
  name: usage-writer-kafka
  namespace: usage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  KAFKA_USERNAME: usage-writer
  KAFKA_PASSWORD: dev-usage-writer-kafka # gitleaks:allow
