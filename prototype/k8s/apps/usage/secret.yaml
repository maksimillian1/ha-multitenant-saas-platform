# Local kind prototype credentials only. They match prototype/k8s/apps/database/cluster.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: usage-db
  namespace: usage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  # Usage Writer's role through PgBouncer (transaction mode).
  DATABASE_URL: postgres://usage_writer:dev-usage-writer@main-pg-cluster-pooler-rw.database.svc:5432/usage?sslmode=require
  # Owner role, straight to the primary. Used only by the migrate job.
  MIGRATE_DATABASE_URL: postgres://usage_owner:dev-usage-owner@main-pg-cluster-rw.database.svc:5432/usage?sslmode=require
  # Superuser, only to create the usage database (CNPG 1.23 has no Database resource).
  ADMIN_DATABASE_URL: postgres://postgres:dev-postgres-superuser@main-pg-cluster-rw.database.svc:5432/postgres?sslmode=require
