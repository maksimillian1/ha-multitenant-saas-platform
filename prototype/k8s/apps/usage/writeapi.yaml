# UsageWriteAPI (docs/contracts/usage-events.md): 202 only after Kafka confirmed the events.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-writeapi
  namespace: usage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: usage-writeapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: usage-writeapi
    spec:
      containers:
        - name: writeapi
          image: hamsp/usage:dev
          imagePullPolicy: IfNotPresent
          args: ["writeapi"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BROKERS
              value: usage-kafka-kafka-bootstrap.kafka.svc:9092
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: usage-writeapi
  namespace: usage
spec:
  selector:
    app.kubernetes.io/name: usage-writeapi
  ports:
    - name: http
      port: 8080
      targetPort: http
