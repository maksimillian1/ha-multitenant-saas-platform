# Usage Writer: consumes usage-events and stores each event once (ADR-0007).
# Wave 1: after the migrate Job (wave 0), before writeapi (wave 2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-writer
  namespace: usage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: usage-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: usage-writer
    spec:
      serviceAccountName: usage-writer
      automountServiceAccountToken: false
      containers:
        - name: writer
          image: hamsp/usage-writer:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BROKERS
              value: usage-kafka-kafka-bootstrap.kafka.svc:9093
            # HAMSP-31: TLS with the cluster CA and a
            # SCRAM login as KafkaUser usage-writer.
            - name: KAFKA_CA_FILE
              value: /etc/kafka-ca/ca.crt
            - name: KAFKA_USERNAME
              valueFrom: {secretKeyRef: {name: usage-writer-kafka, key: KAFKA_USERNAME}}
            - name: KAFKA_PASSWORD
              valueFrom: {secretKeyRef: {name: usage-writer-kafka, key: KAFKA_PASSWORD}}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: usage-writer-db, key: DATABASE_URL}}
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/kafka-ca
              readOnly: true
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        # The usage-kafka cluster CA, loaded by prototype/kafka-ca.sh.
        - name: kafka-ca
          secret:
            secretName: usage-kafka-ca
            defaultMode: 0444
