# Usage Writer: consumes usage-events and stores each event once (ADR-0007).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-writer
  namespace: usage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: usage-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: usage-writer
    spec:
      containers:
        - name: writer
          image: hamsp/usage:dev
          imagePullPolicy: IfNotPresent
          args: ["writer"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BROKERS
              value: usage-kafka-kafka-bootstrap.kafka.svc:9092
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: usage-db, key: DATABASE_URL}}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
