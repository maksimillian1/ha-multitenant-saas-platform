# One ServiceAccount per binary. None of them calls the Kubernetes API, so no
# token is mounted; they exist so that RBAC, Secret access and Kafka identities
# can later be granted per binary.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: usage-writeapi
  namespace: usage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: usage-writer
  namespace: usage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: usage-migrate
  namespace: usage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: false
